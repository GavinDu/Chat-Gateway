<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Chat Gateway native bridge</title>
<body><h1>Local developer bridge</h1>
<p>Enable only on a trusted development Mac. Local processes running as your user can request redacted diagnostics and reload the extension. No provider credentials are exposed by this bridge.</p>
<button id="enable" type="button">Enable native messaging</button>
<button id="disable" type="button">Disable native messaging</button>
<p id="status" role="status"></p>
<script src="native_options.js"></script></body></html>
