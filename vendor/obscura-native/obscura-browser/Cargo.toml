[package]
publish = false
name = "obscura-browser"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/h4ckf0r0day/obscura"

[features]
default = []
stealth = ["obscura-net/stealth", "obscura-js/stealth"]
render = ["obscura-js/render", "dep:image"]

[dependencies]
obscura-dom = { git = "https://github.com/h4ckf0r0day/obscura", rev = "0e2ee76383b95a14e51203799c4abc6790d6c7df", version = "0.1.0" }
obscura-net = { path = "../obscura-net", version = "0.1.0" }
obscura-js = { path = "../obscura-js", version = "0.1.0" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
url = { version = "2" }
tracing = { version = "0.1" }
thiserror = { version = "2" }
anyhow = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
base64 = { version = "0.22" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
