auth:
  # Empty keys keeps authentication disabled; the server remains loopback-only.
  keys: []

server:
  port: 8080
  chrome_profile_dir: ""

memory:
  max_tokens: 8000
  strategy: "sliding_window"

obscura:
  stealth: true
  # storage_dir: ""  # persistent cookie/storage dir for the embedded browser
                     # (defaults to server.chrome_profile_dir when set)

providers:
  - name: qwen
    enabled: false
    priority: 1
    timeout_seconds: 120
    queue_timeout_seconds: 30
    session_pool_size: 1
    models: [qwen, qwen3, qwen-plus, qwen-max]
  - name: metaai
    enabled: false
    priority: 2
    timeout_seconds: 120
    queue_timeout_seconds: 30
    session_pool_size: 1
    models: [meta-ai, llama, llama-4, llama-3.3]
  - name: claude
    enabled: false
    priority: 3
    timeout_seconds: 150
    queue_timeout_seconds: 30
    session_pool_size: 1
    models: [claude, claude-sonnet-4, claude-opus-4, claude-haiku-3.5, claude-sonnet, claude-opus]
  - name: chatgpt
    enabled: false
    priority: 4
    timeout_seconds: 150
    queue_timeout_seconds: 30
    session_pool_size: 1
    models: [gpt, chatgpt, gpt-5, gpt-4o, gpt-4o-mini, o1, o3-mini]
  - name: gemini
    enabled: false
    priority: 5
    timeout_seconds: 120
    queue_timeout_seconds: 30
    session_pool_size: 1
    models: [gemini, gemini-2.0-flash, gemini-1.5-pro, gemini-1.5-flash, gemini-pro]
  - name: grok
    enabled: false
    priority: 6
    timeout_seconds: 120
    queue_timeout_seconds: 30
    session_pool_size: 1
    models: [grok, grok-3, grok-3-mini, grok-2, grok-beta]
  - name: mistral
    enabled: false
    priority: 7
    timeout_seconds: 120
    queue_timeout_seconds: 30
    session_pool_size: 1
    models: [mistral, mistral-large, mistral-small, mixtral, codestral, pixtral]
  - name: perplexity
    enabled: false
    priority: 8
    timeout_seconds: 120
    queue_timeout_seconds: 30
    session_pool_size: 1
    models: [perplexity, sonar, sonar-pro, sonar-reasoning, pplx-8b, pplx-70b]
