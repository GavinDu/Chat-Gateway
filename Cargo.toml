[package]
name = "chat-gateway-rs"
version = "2.0.0-obscura-native"
edition = "2021"
description = "Chat Gateway unified memory layer - Obscura native, no chromiumoxide"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rusqlite = { version = "0.38", features = ["bundled"] }
dashmap = "6.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
async-trait = "0.1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
obscura-core = { git = "https://github.com/h4ckf0r0day/obscura", package = "obscura", features = ["render", "stealth"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
default = ["render", "stealth"]
render = ["obscura-core/render"]
stealth = ["obscura-core/stealth"]

# Obscura's workspace patches taffy + cosmic-text to vendored copies with
# APIs its render layer uses (CssLineBreak, AlignItems::NORMAL, ...).
# [patch] does not propagate through a git dependency, so the same two
# vendored crates are carried here, copied verbatim from the obscura repo
# at the pinned rev (see Cargo.lock).
[patch.crates-io]
taffy = { path = "vendor/taffy" }
cosmic-text = { path = "vendor/cosmic-text" }
