name: Rust CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embedded-native:
    # Ubuntu 22.04 supports the Chromium user-namespace sandbox without
    # disabling AppArmor restrictions on newer hosts. Never use --no-sandbox.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: embedded-ubuntu22-${{ hashFiles('Cargo.lock') }}
      - name: Install native and browser runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev llvm-dev openssh-client
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Build the exact native browser implementation
        run: bash scripts/native-rust.sh cargo build --locked
      - name: Policy and owner tunnel unit tests
        run: |
          node --test browser-login/*.test.mjs
          python3 -B -m unittest discover -s browser-login -p 'test_*.py'
      - name: Isolated authenticated HTTP acceptance
        run: node browser-login/http-smoke.mjs target/debug/chat-gateway-rs
      - name: Sandboxed browser acceptance over an actual temporary SSH connection
        run: node browser-login/smoke.mjs target/debug/chat-gateway-rs --through-ssh

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build container image
        run: docker build --pull --tag chat-gateway-rs:ci .
      - name: Verify container entrypoint
        run: docker run --rm --entrypoint /usr/local/bin/chat-gateway-rs chat-gateway-rs:ci --help
      - name: Verify isolated Docker HTTP and graceful-shutdown smoke
        run: bash scripts/docker-runtime-smoke.sh chat-gateway-rs:ci

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker helper shell syntax
        run: |
          bash -n scripts/docker-run.sh
          bash -n scripts/docker-runtime-smoke.sh

      - name: Validate browser extension JavaScript and manifest
        run: |
          node --check extension/background.js
          node --check extension/shared.js
          node --check extension/popup.js
          node --test extension/background.test.cjs
          node --test extension/tests/*.test.cjs
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8'))"

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify Obscura vendor matches pinned revision
        run: |
          set -euo pipefail
          rev="$(sed -n 's/.*obscura-core = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' Cargo.toml)"
          test -n "$rev"
          repo="$RUNNER_TEMP/obscura-vendor-check"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/h4ckf0r0day/obscura.git "$repo"
          git -C "$repo" checkout --quiet "$rev"
          diff -ru vendor/taffy "$repo/vendor/taffy"
          diff -ru vendor/cosmic-text "$repo/vendor/cosmic-text"

      - name: Verify wreq-util vendored patch
        run: |
          set -euo pipefail
          version="3.0.0-rc.12"
          archive="$RUNNER_TEMP/wreq-util.crate"
          upstream="$RUNNER_TEMP/wreq-util-upstream"
          curl --fail --silent --show-error --location \
            "https://crates.io/api/v1/crates/wreq-util/$version/download" --output "$archive"
          mkdir -p "$upstream"
          tar -xzf "$archive" -C "$upstream"
          upstream_dir="$upstream/wreq-util-$version"
          test -d "$upstream_dir"
          diff -ru --exclude=Cargo.toml --exclude=Cargo.toml.orig --exclude=.cargo_vcs_info.json --exclude=.github --exclude=.gitignore --exclude=CHANGELOG.md --exclude=Cargo.lock --exclude=examples --exclude=release-plz.toml --exclude=rustfmt.toml --exclude=tests --exclude=PATCHES.md vendor/wreq-util "$upstream_dir"
          grep -Fq 'version = "3.0.0-rc.12"' vendor/wreq-util/Cargo.toml
          grep -Fq 'zstd = { version = "0.14.3", optional = true }' vendor/wreq-util/Cargo.toml
          grep -Fq '"zstd 0.14.3"' Cargo.lock
          ! grep -Fq '"zstd 0.13.3"' Cargo.lock

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev llvm-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Audit dependencies, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

      # Formatting is a required check now that main has been normalized.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Run SQLite memory benchmark smoke test
        run: cargo bench --profile dev --locked --bench memory_sqlite -- --smoke

      - name: Run provider benchmark harness smoke test
        run: cargo run --locked --example provider_bench -- --fake --smoke

      - name: Test Python provider benchmark parser
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Test live provider canary assertions
        run: python3 -m unittest discover -s scripts -p 'test_live_provider_canary.py'
