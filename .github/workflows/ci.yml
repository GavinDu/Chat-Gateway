name: Rust CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Obscura vendor matches pinned revision
        run: |
          set -euo pipefail
          rev="$(sed -n 's/.*obscura-core = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' Cargo.toml)"
          test -n "$rev"
          repo="$RUNNER_TEMP/obscura-vendor-check"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/h4ckf0r0day/obscura.git "$repo"
          git -C "$repo" checkout --quiet "$rev"
          diff -ru vendor/taffy "$repo/vendor/taffy"
          diff -ru vendor/cosmic-text "$repo/vendor/cosmic-text"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev llvm-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Formatting is a required check now that main has been normalized.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Run SQLite memory benchmark smoke test
        run: cargo bench --locked --bench memory_sqlite
