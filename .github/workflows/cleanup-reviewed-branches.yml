name: Delete reviewed merged or fully superseded branches

# One-shot housekeeping: changing this reviewed manifest is the only trigger.
# Never run on a feature branch or on ordinary CI builds.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-reviewed-branches.yml

permissions:
  contents: write

jobs:
  delete-reviewed:
    if: github.repository == 'GavinDu/Chat-Gateway'
    runs-on: ubuntu-latest
    steps:
      - name: Verify branch identity and provenance before deletion
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const candidates = [
              // Exact PR #683 head, merged to main after all required CI passed.
              {
                name: "fix/relay-reconnect-session-probe-20261107",
                sha: "7ffcf0de93475e60e50ad246ae3ad32d7ef8b2d7",
                mergedPr: 683,
              },
              // Exact P0 #684 canary head, merged after all required CI passed.
              {
                name: "fix/p0-live-canary-preflight-20261107",
                sha: "75aa8cc9eb5365fc3672bd17410c69cb89304af0",
                mergedPr: 684,
              },
              // The only change on this branch is already documented in main.
              {
                name: "docs/adapter-canary-runbook",
                sha: "01cd6ca2087b7dd42d24ad2b5f59016a229c950f",
                supersededDocument: "docs/ADAPTER_CANARY.md",
              },
              // Remove this housekeeping branch only if its own PR merged.
              {
                name: "chore/delete-reviewed-branches-20261107",
                mergedPrHead: true,
              },
              {
                name: "chore/auto-delete-merged-pr-heads-20261107",
                mergedPrHead: true,
              },
            ];
            for (const candidate of candidates) {
              let remote;
              try {
                remote = await github.rest.git.getRef({
                  owner, repo, ref: "heads/" + candidate.name,
                });
              } catch (error) {
                if (error.status === 404) {
                  core.info("Already deleted: " + candidate.name);
                  continue;
                }
                throw error;
              }
              const current = remote.data.object.sha;
              if (candidate.sha && current !== candidate.sha) {
                core.warning("Skip changed branch: " + candidate.name);
                continue;
              }
              if (candidate.mergedPr || candidate.mergedPrHead) {
                let pr;
                if (candidate.mergedPr) {
                  pr = (await github.rest.pulls.get({
                    owner, repo, pull_number: candidate.mergedPr,
                  })).data;
                } else {
                  const matches = (await github.rest.pulls.list({
                    owner, repo, head: owner + ":" + candidate.name,
                    state: "closed", per_page: 100,
                  })).data;
                  pr = matches.find(item => item.merged_at && item.head.sha === current);
                }
                if (!pr || !pr.merged_at || pr.base.ref !== "main" ||
                    pr.head.ref !== candidate.name || pr.head.sha !== current ||
                    pr.head.repo?.full_name !== context.repo.owner + "/" + context.repo.repo) {
                  core.warning("Skip branch without an exact merged PR: " + candidate.name);
                  continue;
                }
              } else if (candidate.supersededDocument) {
                const path = candidate.supersededDocument;
                const getText = async ref => {
                  const response = await github.rest.repos.getContent({
                    owner, repo, path, ref,
                  });
                  if (Array.isArray(response.data) || response.data.type !== "file") {
                    throw new Error("Unexpected document response for " + path);
                  }
                  return Buffer.from(response.data.content, "base64").toString("utf8");
                };
                const mainText = await getText("main");
                const branchText = await getText(candidate.name);
                // Review on 2026-11-07 found exactly one doc wording change.
                const normalize = text => text.replace(
                  "restricted local JSONL log:", "restricted local log:"
                );
                if (normalize(mainText) !== normalize(branchText)) {
                  core.warning("Skip branch with unsuperseded document: " + candidate.name);
                  continue;
                }
              } else {
                throw new Error("Unreviewed cleanup candidate: " + candidate.name);
              }
              await github.rest.git.deleteRef({
                owner, repo, ref: "heads/" + candidate.name,
              });
              core.info("Deleted reviewed branch: " + candidate.name);
            }
