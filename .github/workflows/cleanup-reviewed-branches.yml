              {
                name: "fix/readiness-browser-worker-liveness-20261027",
                sha: "71fcb8b2126c3c629a718956c647116f07308bf6",
                supersededPr: 300,
                successorPr: 302,
              },
              {
                name: "feat/conversation-key-isolation-20261027",
                sha: "ae44ab4816f87f4729c5a2ed9a48e7cb69a3e9fd",
                supersededPr: 272,
                successorPr: 292,
              },
              {
                name: "feat-retention-ttl-current-20261027",
                sha: "e28f41c13b05828ae3c5870ce70ada387ddb732c",
                supersededPr: 271,
                successorPr: 266,
              },
              {
                name: "feat-provider-benchmark-current-20261027",
                sha: "fe84898ab50577c9fdcee889b40ea3812262ad54",
                supersededPr: 270,
                successorPr: 265,
              },
              {
                name: "feat/provider-thread-api-current-main-20261027",
                sha: "9cdeed0fd7244951ad7266e8843aee800a5e2c87",
                supersededPr: 257,
                successorPr: 249,
              },
              // Once this cleanup PR itself merges, remove its head too;
              // a missing or unmerged exact-head PR is never sufficient.
              {
                name: "chore/reconcile-15-superseded-branches-20261121",
                mergedPrHead: true,
              },
            ];
            for (const candidate of candidates) {
              let remote;
              try {
                remote = await github.rest.git.getRef({
                  owner, repo, ref: "heads/" + candidate.name,
                });
              } catch (error) {
                if (error.status === 404) {
                  core.info("Already deleted: " + candidate.name);
                  continue;
                }
                throw error;
              }
              const current = remote.data.object.sha;
              if (candidate.sha && current !== candidate.sha) {
                core.warning("Skip changed branch: " + candidate.name);
                continue;
              }
              if (candidate.mergedPr || candidate.mergedPrHead) {
                let pr;
                if (candidate.mergedPr) {
                  pr = (await github.rest.pulls.get({
                    owner, repo, pull_number: candidate.mergedPr,
                  })).data;
                } else {
                  const matches = (await github.rest.pulls.list({
                    owner, repo, head: owner + ":" + candidate.name,
                    state: "closed", per_page: 100,
                  })).data;
                  pr = matches.find(item => item.merged_at && item.head.sha === current);
                }
                if (!pr || !pr.merged_at || pr.base.ref !== "main" ||
                    pr.head.ref !== candidate.name || pr.head.sha !== current ||
                    pr.head.repo?.full_name !== context.repo.owner + "/" + context.repo.repo) {
                  core.warning("Skip branch without an exact merged PR: " + candidate.name);
                  continue;
                }
              } else if (candidate.supersededPr && candidate.successorPr) {
                const oldPr = (await github.rest.pulls.get({
                  owner, repo, pull_number: candidate.supersededPr,
                })).data;
                const successor = (await github.rest.pulls.get({
                  owner, repo, pull_number: candidate.successorPr,
                })).data;
                const cited = (oldPr.body || "").match(/#[0-9]+/g) || [];
                if (!candidate.sha || oldPr.state !== "closed" || oldPr.merged_at ||
                    oldPr.head.ref !== candidate.name || oldPr.head.sha !== current ||
                    oldPr.head.repo?.full_name !== context.repo.owner + "/" + context.repo.repo ||
                    !/supersed|duplicat|closed in favor/i.test(oldPr.body || "") ||
                    !cited.includes("#" + candidate.successorPr) ||
                    !successor.merged_at || successor.base.ref !== "main" ||
                    successor.head.repo?.full_name !== context.repo.owner + "/" + context.repo.repo) {
                  core.warning("Skip without explicit merged supersession: " + candidate.name);
                  continue;
                }
                const [oldFiles, successorFiles] = await Promise.all([
                  github.paginate(github.rest.pulls.listFiles, {
                    owner, repo, pull_number: candidate.supersededPr, per_page: 100,
                  }),
                  github.paginate(github.rest.pulls.listFiles, {
                    owner, repo, pull_number: candidate.successorPr, per_page: 100,
                  }),
                ]);
                const successorPaths = new Set(successorFiles.map(file => file.filename));
                if (!oldFiles.length ||
                    !oldFiles.every(file => successorPaths.has(file.filename))) {
                  core.warning("Skip supersession without complete file coverage: " + candidate.name);
                  continue;
                }
              } else if (candidate.supersededDocument) {
                const path = candidate.supersededDocument;
                const getText = async ref => {
                  const response = await github.rest.repos.getContent({
                    owner, repo, path, ref,
                  });
                  if (Array.isArray(response.data) || response.data.type !== "file") {
                    throw new Error("Unexpected document response for " + path);
                  }
                  return Buffer.from(response.data.content, "base64").toString("utf8");
                };
                const mainText = await getText("main");
                const branchText = await getText(candidate.name);
                // Review on 2026-11-07 found exactly one doc wording change.
                const normalize = text => text.replace(
                  "restricted local JSONL log:", "restricted local log:"
                );
                if (normalize(mainText) !== normalize(branchText)) {
                  core.warning("Skip branch with unsuperseded document: " + candidate.name);
                  continue;
                }
              } else {
                throw new Error("Unreviewed cleanup candidate: " + candidate.name);
              }
              // Applies to *all* provenance modes, including already-merged
              // heads and this housekeeping PR after merge: never strand an
              // open PR or a dependent stack by deleting its base/head.
              const active = await github.paginate(github.rest.pulls.list, {
                owner, repo, head: owner + ":" + candidate.name,
                state: "open", per_page: 100,
              });
              const dependents = await github.paginate(github.rest.pulls.list, {
                owner, repo, base: candidate.name, state: "open", per_page: 100,
              });
              if (active.length || dependents.length) {
                core.warning("Skip branch still in an open PR graph: " + candidate.name);
                continue;
              }
              try {
                await github.rest.git.deleteRef({
                  owner, repo, ref: "heads/" + candidate.name,
                });
                core.info("Deleted reviewed branch: " + candidate.name);
              } catch (error) {
                if (error.status === 404) {
                  core.info("Already deleted by concurrent cleanup: " + candidate.name);
                  continue;
                }
                throw error;
              }
            }
