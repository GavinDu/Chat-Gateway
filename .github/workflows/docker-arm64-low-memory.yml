name: Docker ARM64 Low Memory (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

# Explicit opt-in only; no pull_request, push, or schedule trigger.
concurrency:
  group: arm64-low-memory-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-arm64-low-memory:
    # The local failure was ARM64 release linking in a 2 GiB VM, not the
    # x86/debug path. Limit the entire builder to 2 GiB with no swap, then
    # exercise the same helper command users run and its resulting image.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Set up bounded native ARM64 builder
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            memory=2g
            memory-swap=2g
      - name: Verify builder memory and swap limits
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          container="buildx_buildkit_${BUILDER}0"
          test "$(docker inspect --format '{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}}' "$container")" = '2147483648 2147483648'
      # CLI invocations need the runtime cache variables that build-push-action
      # normally supplies itself; never print their values.
      - name: Expose GitHub cache runtime
        uses: crazy-max/ghaction-github-runtime@v3
      - name: Build release image through the real Docker helper
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          CHAT_GATEWAY_IMAGE: chat-gateway-rs:arm64-2gb
          CHAT_GATEWAY_BUILD_PLATFORM: linux/arm64
          CHAT_GATEWAY_BUILD_CACHE_FROM: type=gha,scope=chat-gateway-arm64-2gb
          CHAT_GATEWAY_BUILD_CACHE_TO: type=gha,scope=chat-gateway-arm64-2gb,mode=max,timeout=3m,ignore-error=true
        run: |
          pwd
          bash scripts/docker-run.sh build
      - name: Load cached release builder for the strict final-link regression
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          CHAT_GATEWAY_IMAGE: chat-gateway-rs:arm64-link-builder
          CHAT_GATEWAY_BUILD_PLATFORM: linux/arm64
          CHAT_GATEWAY_BUILD_TARGET: builder
          CHAT_GATEWAY_BUILD_CACHE_FROM: type=gha,scope=chat-gateway-arm64-2gb
        run: |
          pwd
          bash scripts/docker-run.sh build
      - name: Relink production executable within 1 GiB and no swap
        run: |
          pwd
          docker run --rm --memory=1g --memory-swap=1g --cpus=1 --network=none \
            --env CARGO_NET_OFFLINE=true --entrypoint bash chat-gateway-rs:arm64-link-builder \
            -c 'pwd; status=0; bash /usr/local/bin/chat-gateway-release-link || status=$?; cat /sys/fs/cgroup/memory.events; cat /sys/fs/cgroup/memory.peak; exit "$status"'
      - name: Verify architecture, entrypoint and isolated runtime
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' chat-gateway-rs:arm64-2gb)" = arm64
          pwd
          docker run --rm chat-gateway-rs:arm64-2gb --help
          pwd
          bash scripts/docker-runtime-smoke.sh chat-gateway-rs:arm64-2gb

